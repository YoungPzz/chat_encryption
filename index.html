<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket 房间聊天客户端</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: #4f46e5;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin-bottom: 5px;
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .status.connected {
            background: #10b981;
        }

        .status.disconnected {
            background: #ef4444;
        }

        .main-content {
            padding: 20px;
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            gap: 20px;
            min-height: 600px;
        }

        .sidebar {
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            overflow-y: auto;
        }

        .center-panel {
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
        }

        .room-list {
            margin-bottom: 30px;
        }

        .room-list h4 {
            margin-bottom: 15px;
            color: #374151;
            border-bottom: 2px solid #4f46e5;
            padding-bottom: 5px;
        }

        .room-item {
            background: white;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.2s;
        }

        .room-item:hover {
            background: #e0e7ff;
            border-color: #4f46e5;
        }

        .room-item.active {
            background: #4f46e5;
            color: white;
        }

        .room-item .room-name {
            font-weight: 600;
            margin-bottom: 3px;
        }

        .room-item .room-id {
            font-size: 12px;
            opacity: 0.7;
        }

        .room-item .room-users {
            font-size: 11px;
            margin-top: 5px;
        }

        .create-room {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .create-room h4 {
            margin-bottom: 15px;
            color: #374151;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #374151;
            font-size: 14px;
        }

        .control-group input, .control-group textarea, .control-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            font-size: 14px;
        }

        .message-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .messages {
            flex: 1;
            background: #1f2937;
            color: #f9fafb;
            padding: 15px;
            border-radius: 5px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .message-item {
            margin-bottom: 8px;
            padding: 8px;
            border-radius: 5px;
            line-height: 1.4;
        }

        .message-item.room-message {
            background: #065f46;
        }

        .message-item.room-notification {
            background: #7c2d12;
        }

        .message-item.system {
            background: #92400e;
        }

        .message-item.error {
            background: #7f1d1d;
        }

        .message-item.sent {
            background: #1e40af;
        }

        .message-header {
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 3px;
        }

        .message-content {
            word-wrap: break-word;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            font-size: 14px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-right: 10px;
            margin-bottom: 10px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
        }

        .btn-primary:hover {
            background: #4338ca;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn:disabled {
            background: #d1d5db;
            cursor: not-allowed;
        }

        /* 密钥交换状态样式 */
        .success {
            color: #10b981;
            font-weight: bold;
        }

        .error {
            color: #ef4444;
            font-weight: bold;
        }

        .stats-panel {
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            margin-top: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .stat-item {
            background: white;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .stat-number {
            font-size: 20px;
            font-weight: bold;
            color: #4f46e5;
        }

        .stat-label {
            font-size: 11px;
            color: #6b7280;
            margin-top: 5px;
        }

        .user-info {
            margin-bottom: 30px;
        }

        .user-info h4 {
            margin-bottom: 15px;
            color: #374151;
            border-bottom: 2px solid #4f46e5;
            padding-bottom: 5px;
        }

        .user-item {
            background: white;
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
            font-size: 13px;
        }

        .user-item.current-user {
            background: #dbeafe;
            border-color: #3b82f6;
            font-weight: 600;
        }

        .room-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏠 WebSocket 房间聊天客户端</h1>
            <p>实时连接状态: <span id="connectionStatus" class="status disconnected">未连接</span></p>
        </div>

        <div class="main-content">
            <!-- 左侧面板 - 房间列表 -->
            <div class="sidebar">
                <div class="room-list">
                    <h4>📋 可用房间</h4>
                    <div id="roomList">
                        <div class="room-item" data-room-id="general">
                            <div class="room-name">公共聊天室</div>
                            <div class="room-id">general</div>
                            <div class="room-users">0 用户</div>
                        </div>
                    </div>
                </div>

                <div class="create-room">
                    <h4>➕ 创建房间</h4>
                    
                    <div class="control-group">
                        <label for="newRoomId">房间ID:</label>
                        <input type="text" id="newRoomId" placeholder="输入房间ID" required>
                    </div>

                    <div class="control-group">
                        <label for="newRoomName">房间名称:</label>
                        <input type="text" id="newRoomName" placeholder="输入房间名称" required>
                    </div>

                    <div class="control-group">
                        <label for="newRoomDesc">房间描述:</label>
                        <input type="text" id="newRoomDesc" placeholder="输入房间描述">
                    </div>

                    <div class="control-group">
                        <button id="createRoomBtn" class="btn btn-success">创建房间</button>
                    </div>
                </div>

                <div class="stats-panel">
                    <h4>📊 连接统计</h4>
                    <div class="stats">
                        <div class="stat-item">
                            <div class="stat-number" id="totalConnections">0</div>
                            <div class="stat-label">总连接数</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number" id="totalRooms">0</div>
                            <div class="stat-label">房间数</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number" id="totalUsers">0</div>
                            <div class="stat-label">总用户数</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number" id="connectionTime">--</div>
                            <div class="stat-label">连接时长(秒)</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 中间面板 - 消息区域 -->
            <div class="center-panel">
                <div class="user-info">
                    <h4>👤 用户信息</h4>
                    <div id="currentUserInfo">
                        <div style="color: #6b7280;">请先连接服务器并加入房间</div>
                    </div>
                </div>

                <div class="room-controls">
                    <div style="flex: 1;">
                        <label for="username">用户名:</label>
                        <input type="text" id="username" placeholder="输入你的用户名" value="测试用户">
                    </div>
                    <button id="connectBtn" class="btn btn-primary">连接服务器</button>
                    <button id="disconnectBtn" class="btn btn-danger" disabled>断开连接</button>
                </div>

                <!-- SM2密钥交换控制面板 -->
                <div style="background: #f0f9ff; padding: 15px; border-radius: 8px; border: 1px solid #0ea5e9; margin-bottom: 15px;">
                    <h4 style="margin-bottom: 10px; color: #0c4a6e;">🔐 SM2国密密钥交换</h4>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px;">
                        <button id="generateKeysBtn" class="btn btn-success" onclick="generateClientKeys()" disabled>🔑 生成客户端密钥</button>
                        <span id="serverKeyStatus" class="error">服务器公钥: 未接收</span>
                        <span id="clientKeyStatus" class="error">客户端密钥: 未生成</span>
                    </div>
                    <div id="keyInfo" style="font-size: 12px; color: #374151;">
                        <div><strong>服务器公钥:</strong> <span id="serverKeyInfo">等待接收...</span></div>
                        <div><strong>客户端密钥:</strong> <span id="clientKeyInfo">等待生成...</span></div>
                    </div>
                </div>

                <div class="message-area">
                    <div id="messages" class="messages">
                        <div class="message-item system">
                            <div class="message-content">欢迎使用WebSocket房间聊天客户端！请先连接服务器。</div>
                        </div>
                    </div>
                    
                    <div class="input-area">
                        <input type="text" id="messageInput" placeholder="输入消息... (按Enter发送)" disabled>
                        <button id="sendBtn" class="btn btn-primary" disabled>发送</button>
                    </div>
                </div>

                <div>
                    <button class="btn btn-secondary" onclick="sendPing()">发送心跳</button>
                    <button class="btn btn-secondary" onclick="clearMessages()">清空消息</button>
                    <button class="btn btn-secondary" onclick="refreshRooms()">刷新房间</button>
                </div>
            </div>

            <!-- 右侧面板 - 当前房间成员 -->
            <div class="sidebar">
                <div class="room-info">
                    <h4>🏠 当前房间</h4>
                    <div id="currentRoomInfo">
                        <div style="color: #6b7280;">未加入任何房间</div>
                    </div>
                </div>

                <div class="room-members" style="margin-top: 30px;">
                    <h4>👥 房间成员</h4>
                    <div id="roomMembers">
                        <div style="color: #6b7280;">暂无成员</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sm-crypto@0.3.13/dist/sm-crypto.min.js"></script>
    <script>
        let ws = null;
        let isConnected = false;
        let connectionStartTime = null;
        let currentRoom = null;
        let username = '测试用户';
        let rooms = new Map();
        let roomMembers = new Map();
        
        // SM2密钥交换相关变量
        let serverPublicKey = null;
        let clientKeyPair = null;
        let userId = null;

        // DOM 元素
        const connectionStatus = document.getElementById('connectionStatus');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const sendBtn = document.getElementById('sendBtn');
        const messages = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const usernameInput = document.getElementById('username');
        const roomList = document.getElementById('roomList');
        const currentRoomInfo = document.getElementById('currentRoomInfo');
        const roomMembersList = document.getElementById('roomMembers');
        const currentUserInfo = document.getElementById('currentUserInfo');
        
        // 统计元素
        const totalConnections = document.getElementById('totalConnections');
        const totalRooms = document.getElementById('totalRooms');
        const totalUsers = document.getElementById('totalUsers');
        const connectionTimeDisplay = document.getElementById('connectionTime');

        // 连接WebSocket服务器
        function connect() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                addMessage('已经连接', 'system');
                return;
            }

            const serverUrl = 'ws://localhost:3000';
            addMessage(`尝试连接到 ${serverUrl}...`, 'system');

            ws = new WebSocket(serverUrl);

            ws.onopen = function(event) {
                isConnected = true;
                connectionStartTime = Date.now();
                username = usernameInput.value || '测试用户';
                updateConnectionStatus('connected');
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                sendBtn.disabled = false;
                messageInput.disabled = false;
                addMessage('WebSocket连接已建立', 'system');
                
                // 更新用户信息显示
                updateUserInfo();
                
                // 开始更新时间
                setInterval(updateConnectionTime, 1000);
                
                // 获取房间列表
                refreshRooms();
                
                // 更新密钥交换UI
                updateKeyExchangeUI();
            };

            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (e) {
                    addMessage(`接收非JSON消息: ${event.data}`, 'system');
                }
            };

            ws.onclose = function(event) {
                isConnected = false;
                updateConnectionStatus('disconnected');
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
                sendBtn.disabled = true;
                messageInput.disabled = true;
                addMessage(`WebSocket连接已关闭 (代码: ${event.code})`, 'system');
                currentRoom = null;
                updateCurrentRoomInfo();
                updateRoomMembers();
                
                // 重置密钥交换相关状态
                serverPublicKey = null;
                clientKeyPair = null;
                userId = null;
                updateKeyExchangeUI();
            };

            ws.onerror = function(error) {
                addMessage('WebSocket错误: ' + JSON.stringify(error), 'error');
            };
        }

        // 断开WebSocket连接
        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        // 处理接收到的消息
        function handleMessage(data) {
            console.log('收到消息:', data);
            console.log('=== handleMessage 被调用 ===');
            console.log('消息内容:', data);
            console.log('消息类型:', data.type);
            
            switch(data.type) {
                case 'welcome':
                    console.log('处理 welcome 消息');
                    handleWelcomeMessage(data);
                    break;
                    
                case 'key_info':
                    console.log('处理 key_info 消息');
                    handleKeyInfoMessage(data);
                    break;
                    
                case 'client_keys_ready':
                    handleClientKeysReady(data);
                    break;
                case 'room_key_info':
                    handleRoomKeyInfoMessage(data);
                    break;
                case 'room_key_summary':
                    handleRoomKeySummaryMessage(data);
                    break;
                case 'server_public_key':
                    handleServerPublicKeyMessage(data);
                    break;
                    
                case 'client_keys_generated':
                    console.log('=== 处理服务端生成的客户端密钥 ===');
                    console.log('服务端生成的密钥信息:', data);
                    
                    // 保存客户端密钥对
                    if (data.clientKeys) {
                        clientKeyPair = {
                            publicKey: data.clientKeys.publicKey,
                            privateKey: data.clientKeys.privateKey,
                            algorithm: data.clientKeys.algorithm,
                            curve: data.clientKeys.curve,
                            createdAt: data.clientKeys.createdAt,
                            generatedBy: data.clientKeys.generatedBy
                        };
                        
                        console.log('客户端密钥对已保存:', clientKeyPair);
                    }
                    
                    // 显示密钥生成成功信息
                    addMessage('✅ 服务端已成功生成您的SM2密钥对', 'success');
                    if (data.summary) {
                        addMessage(`🔑 客户端公钥长度: ${data.summary.clientPublicKeyLength || 'N/A'} 字符`, 'system');
                        addMessage(`🔒 客户端私钥长度: ${data.summary.clientPrivateKeyLength || 'N/A'} 字符`, 'system');
                        addMessage(`📋 生成方式: ${data.summary.exchangeMethod || '服务端生成'}`, 'system');
                    }
                    
                    updateKeyExchangeUI();
                    break;
                    
                case 'pong':
                    addMessage('收到心跳回复', 'system');
                    break;
                    
                case 'room_joined':
                    currentRoom = data.room;
                    addMessage(`成功加入房间: ${data.room.name}`, 'system');
                    updateCurrentRoomInfo();
                    updateRoomMembers(data.room.users || []);
                    break;
                    
                case 'room_left':
                    addMessage(`已离开房间: ${data.room}`, 'system');  // 期望data.room对象
                    currentRoom = null;
                    updateCurrentRoomInfo();
                    updateRoomMembers();
                    break;
                    
                case 'room_message':
                    addRoomMessage(data);
                    break;
                    
                case 'room_notification':
                    addRoomNotification(data.message);
                    break;
                    
                case 'room_update':
                    updateRoomInList(data.room);
                    if (currentRoom && data.room.id === currentRoom.id) {
                        currentRoom = data.room;
                        updateCurrentRoomInfo();
                        updateRoomMembers(data.room.users || []);
                    }
                    break;
                    
                case 'room_created':
                    addMessage(`房间创建成功: ${data.room.name}`, 'system');
                    updateRoomInList(data.room);
                    break;
                    
                case 'room_list':
                    // 获取房间列表响应
                    updateRoomList(data.rooms);
                    if (data.rooms) {
                        addMessage(`获取到 ${data.rooms.length} 个房间`, 'system');
                    }
                    break;
                    
                case 'room_list_update':
                    // 更新房间列表
                    updateRoomList(data.rooms);
                    if (data.rooms) {
                        addMessage('房间列表已更新', 'system');
                    }
                    break;
                    
                case 'room_deleted':
                    addMessage(`房间已删除: ${data.room}`, 'system');
                    removeRoomFromList(data.room);
                    if (currentRoom && currentRoom.id === data.room) {
                        currentRoom = null;
                        updateCurrentRoomInfo();
                        updateRoomMembers();
                    }
                    break;
                    
                case 'error':
                    addMessage(`错误: ${data.message}`, 'error');
                    break;
                    
                default:
                    addMessage(`收到消息: ${JSON.stringify(data)}`, 'system');
            }
        }

        // 处理欢迎消息
        function handleWelcomeMessage(data) {
            console.log('收到欢迎消息:', data);
            userId = data.userId;
            serverPublicKey = data.serverKeyInfo;
            
            addMessage(`👋 欢迎! 用户ID: ${userId}`, 'system');
            addMessage(`🔑 收到服务器公钥`, 'system');
            addMessage(`📋 服务器公钥长度: ${serverPublicKey?.publicKey?.length || 0} 字符`, 'system');
            
            console.log('服务器公钥信息:', serverPublicKey);
            updateKeyExchangeUI();
        }

        // 处理密钥信息消息
        function handleKeyInfoMessage(data) {
            addMessage(`
📋 === SM2密钥交换完成 ===
服务器信息:
  算法: ${data.serverKey.algorithm}
  曲线: ${data.serverKey.curve}
  公钥长度: ${data.summary.serverPublicKeyLength} 字符
  
客户端信息:
  算法: ${data.clientKey.algorithm}
  曲线: ${data.clientKey.curve}
  公钥长度: ${data.summary.clientPublicKeyLength} 字符
  私钥长度: ${data.summary.clientPrivateKeyLength} 字符
  
交换状态: ${data.summary.exchangeCompleted ? '✅ 完成' : '❌ 失败'}
时间: ${new Date(data.timestamp).toLocaleString()}
===================================
            `, 'system');
        }

        // 处理房间密钥信息消息
        function handleRoomKeyInfoMessage(data) {
            addMessage(`🔑 收到房间密钥信息: ${data.roomId}`, 'key');
            
            try {
                // 检查客户端私钥是否存在
                if (!clientKeyPair || !clientKeyPair.privateKey) {
                    addMessage(`❌ 客户端私钥未就绪，请先生成客户端密钥`, 'error');
                    return;
                }
                console.log('收到数据:', data);
                // 解密房间密钥数据
                const decryptedData = decryptRoomKeyData(data.encryptedKeyInfo, clientKeyPair.privateKey);
                if (decryptedData) {
                    // 保存房间基础值和动态因子
                    currentRoom.si = decryptedData.si;
                    currentRoom.froom = decryptedData.froom;
                    
                    // 计算组密钥
                    const groupKey = calculateGroupKey(decryptedData.si, decryptedData.froom);
                    currentRoom.groupKey = groupKey;
                    
                    addMessage(`✅ 房间密钥解密成功!`, 'key');
                    addMessage(`🔑 房间基础值 S_i: ${formatKey(decryptedData.si)}`, 'key');
                    addMessage(`🔄 房间动态因子 F_room: ${formatKey(decryptedData.froom)}`, 'key');
                    addMessage(`🔐 组密钥 GK: ${formatKey(groupKey)}`, 'key');
                    
                    // 更新UI显示
                    updateRoomKeyDisplay();
                } else {
                    addMessage(`❌ 房间密钥解密失败: 无效的私钥或数据`, 'error');
                }
            } catch (error) {
                addMessage(`❌ 处理房间密钥信息错误: ${error.message}`, 'error');
            }
        }

        // 处理房间密钥摘要消息
        function handleRoomKeySummaryMessage(data) {
            addMessage(`📋 房间密钥摘要: ${data.roomId}`, 'key');
            updateRoomKeyDisplay();
        }

        // 处理客户端密钥准备
        function handleClientKeysReady(data) {
            // TODO: 实现客户端密钥准备逻辑
            console.log('客户端密钥已准备:', data);
            // 可以在这里更新 UI 或者进行后续处理
        }

        // 处理服务器公钥消息
        function handleServerPublicKeyMessage(data) {
            console.log('服务器公钥消息:', data);
            serverPublicKey = data.serverKeyInfo;
            updateKeyExchangeUI();
        }

        // 解密房间密钥数据
        function decryptRoomKeyData(encryptedData, privateKey) {
            try {
                // 使用SM2私钥解密数据
                // 这里需要实际的SM2解密实现
                // 暂时使用模拟实现
                if (!encryptedData || !privateKey) {
                    return null;
                }
                
                // 模拟解密过程（实际应该使用SM2库）
                const decrypted = {
                    si: 'demo_si_' + Date.now(), // 模拟S_i值
                    froom: encryptedData.froom || 'demo_froom_' + Date.now() // 模拟F_room值
                };
                
                return decrypted;
            } catch (error) {
                console.error('房间密钥解密失败:', error);
                return null;
            }
        }

        // 计算组密钥
        function calculateGroupKey(si, froom) {
            try {
                // 使用KDF计算组密钥: GK = KDF(S_i, F_room)
                // 这里需要实际的SM3-KDF实现
                // 暂时使用模拟实现
                const combined = si + '_' + froom;
                const groupKey = 'GK_' + btoa(combined).substring(0, 32);
                return groupKey;
            } catch (error) {
                console.error('组密钥计算失败:', error);
                return null;
            }
        }

        // 更新房间密钥显示
        function updateRoomKeyDisplay() {
            const keyInfoElement = document.getElementById('keyInfo');
            if (!keyInfoElement) return;

            let html = '<h3>🔑 房间密钥信息</h3>';
            
            if (currentRoom && currentRoom.groupKey) {
                html += `
                    <div class="key-item">
                        <strong>房间ID:</strong> ${currentRoom.id}
                    </div>
                    <div class="key-item">
                        <strong>房间基础值 S_i:</strong> ${formatKey(currentRoom.si)}
                    </div>
                    <div class="key-item">
                        <strong>动态因子 F_room:</strong> ${formatKey(currentRoom.froom)}
                    </div>
                    <div class="key-item">
                        <strong>组密钥 GK:</strong> ${formatKey(currentRoom.groupKey)}
                    </div>
                `;
            } else {
                html += '<div class="key-item">暂无房间密钥信息</div>';
            }
            
            keyInfoElement.innerHTML = html;
        }

        // 请求房间密钥
        function requestRoomKeys() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('错误: 请先连接服务器', 'error');
                return;
            }

            if (!currentRoom) {
                addMessage('错误: 请先加入一个房间', 'error');
                return;
            }

            const data = {
                type: 'request_room_keys',
                roomId: currentRoom.id
            };

            ws.send(JSON.stringify(data));
            addMessage(`🔑 请求房间密钥: ${currentRoom.id}`, 'system');
        }

        // 请求服务端生成客户端密钥
        function generateClientKeys() {
            console.log('=== 请求服务端生成客户端密钥对 ===');
            
            if (!isConnected) {
                addMessage('错误: 请先连接到服务器', 'error');
                return;
            }

            try {
                // 生成用户ID（如果还没有的话）
                if (!userId) {
                    userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                }

                // 发送请求服务端生成密钥的消息
                const requestMessage = {
                    type: 'request_client_keys',
                    userId: userId,
                    timestamp: new Date().toISOString()
                };

                console.log('发送客户端密钥生成请求:', requestMessage);
                sendToServer(requestMessage);

                addMessage('🔐 正在请求服务端生成客户端密钥对...', 'system');
                updateKeyExchangeUI();

            } catch (error) {
                console.error('请求服务端生成密钥时出错:', error);
                addMessage('❌ 请求服务端生成密钥失败: ' + error.message, 'error');
                updateKeyExchangeUI();
            }
        }

        // 更新密钥交换UI
        function updateKeyExchangeUI() {
            const generateKeysBtn = document.getElementById('generateKeysBtn');
            const serverKeyStatus = document.getElementById('serverKeyStatus');
            const clientKeyStatus = document.getElementById('clientKeyStatus');
            const serverKeyInfo = document.getElementById('serverKeyInfo');
            const clientKeyInfo = document.getElementById('clientKeyInfo');
            
            // 更新按钮状态
            generateKeysBtn.disabled = !isConnected || !serverPublicKey;
            
            // 更新服务器密钥状态
            if (serverPublicKey) {
                serverKeyStatus.textContent = '服务器公钥: ✅ 已接收';
                serverKeyStatus.className = 'success';
                serverKeyInfo.textContent = formatKey(serverPublicKey.publicKey);
            } else {
                serverKeyStatus.textContent = '服务器公钥: ❌ 未接收';
                serverKeyStatus.className = 'error';
                serverKeyInfo.textContent = '等待接收...';
            }

            // 更新客户端密钥状态
            if (clientKeyPair) {
                clientKeyStatus.textContent = '客户端密钥: ✅ 已生成';
                clientKeyStatus.className = 'success';
                clientKeyInfo.textContent = formatKey(clientKeyPair.publicKey);
            } else {
                clientKeyStatus.textContent = '客户端密钥: ❌ 未生成';
                clientKeyStatus.className = 'error';
                clientKeyInfo.textContent = '等待生成...';
            }
            
            // 添加调试日志
            console.log('密钥交换UI更新状态:', {
                isConnected: isConnected,
                hasServerPublicKey: !!serverPublicKey,
                hasClientKeyPair: !!clientKeyPair,
                buttonEnabled: !generateKeysBtn.disabled
            });
        }

        // 格式化密钥显示
        function formatKey(key) {
            if (!key) return '';
            if (key.length <= 20) return key;
            return key.substring(0, 20) + '...' + key.substring(key.length - 20);
        }

        // 发送消息到服务器
        function sendToServer(message) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(message));
            } else {
                addMessage('❌ 连接已断开，无法发送消息', 'error');
            }
        }

        // 发送消息
        function sendMessage() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('错误: 未连接到服务器', 'error');
                return;
            }

            const message = messageInput.value.trim();
            if (!message) return;

            if (!currentRoom) {
                addMessage('错误: 请先加入一个房间', 'error');
                return;
            }

            const data = {
                type: 'room_message',
                roomId: currentRoom.id,
                message: message,
                from: username,
                timestamp: new Date().toISOString()
            };

            try {
                ws.send(JSON.stringify(data));
                // addMessage(`发送消息到 ${currentRoom.name}: ${message}`, 'sent');
                messageInput.value = '';
            } catch (error) {
                addMessage('发送消息错误: ' + error.message, 'error');
            }
        }

        // 发送心跳
        function sendPing() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('错误: 未连接到服务器', 'error');
                return;
            }

            const data = { type: 'ping' };
            ws.send(JSON.stringify(data));
            addMessage('发送心跳', 'system');
        }

        // 加入房间
        function joinRoom(roomId) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('错误: 请先连接服务器', 'error');
                return;
            }

            const data = {
                type: 'join_room',
                roomId: roomId,
                username: username
            };

            ws.send(JSON.stringify(data));
            addMessage(`尝试加入房间: ${roomId}`, 'system');
        }

        // 离开房间
        function leaveRoom() {
            if (!ws || ws.readyState !== WebSocket.OPEN || !currentRoom) {
                return;
            }

            const data = {
                type: 'leave_room',
                roomId: currentRoom.id
            };

            ws.send(JSON.stringify(data));
        }

        // 创建房间
        function createRoom() {
            const roomId = document.getElementById('newRoomId').value.trim();
            const roomName = document.getElementById('newRoomName').value.trim();
            const roomDesc = document.getElementById('newRoomDesc').value.trim();

            if (!roomId || !roomName) {
                addMessage('错误: 房间ID和名称不能为空', 'error');
                return;
            }

            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('错误: 请先连接服务器', 'error');
                return;
            }

            const data = {
                type: 'create_room',
                roomId: roomId,
                roomName: roomName,
                description: roomDesc,
                options: {}
            };

            ws.send(JSON.stringify(data));
            addMessage(`尝试创建房间: ${roomName}`, 'system');
            
            // 清空输入
            document.getElementById('newRoomId').value = '';
            document.getElementById('newRoomName').value = '';
            document.getElementById('newRoomDesc').value = '';
        }

        // 更新连接状态显示
        function updateConnectionStatus(status) {
            if (status === 'connected') {
                connectionStatus.textContent = '已连接';
                connectionStatus.className = 'status connected';
            } else {
                connectionStatus.textContent = '未连接';
                connectionStatus.className = 'status disconnected';
                connectionTimeDisplay.textContent = '--';
            }
        }

        // 更新连接时间
        function updateConnectionTime() {
            if (isConnected && connectionStartTime) {
                const elapsed = Math.floor((Date.now() - connectionStartTime) / 1000);
                connectionTimeDisplay.textContent = elapsed;
            }
        }

        // 添加消息到日志
        function addMessage(content, type = 'system') {
            const messageElement = document.createElement('div');
            messageElement.className = `message-item ${type}`;
            
            const timestamp = new Date().toLocaleTimeString();
            messageElement.innerHTML = `
                <div class="message-header">[${timestamp}] ${type.toUpperCase()}</div>
                <div class="message-content">${content}</div>
            `;
            
            messages.appendChild(messageElement);
            messages.scrollTop = messages.scrollHeight;
        }

        // 添加房间消息
        function addRoomMessage(data) {
            const messageElement = document.createElement('div');
            messageElement.className = 'message-item room-message';
            
            const timestamp = new Date(data.timestamp).toLocaleTimeString();
            messageElement.innerHTML = `
                <div class="message-header">[${timestamp}] ${data.from} 在 ${data.roomName}</div>
                <div class="message-content">${data.message}</div>
            `;
            
            messages.appendChild(messageElement);
            messages.scrollTop = messages.scrollHeight;
        }

        // 添加房间通知
        function addRoomNotification(message) {
            const messageElement = document.createElement('div');
            messageElement.className = 'message-item room-notification';
            
            const timestamp = new Date().toLocaleTimeString();
            messageElement.innerHTML = `
                <div class="message-header">[${timestamp}] 房间通知</div>
                <div class="message-content">${message}</div>
            `;
            
            messages.appendChild(messageElement);
            messages.scrollTop = messages.scrollHeight;
        }

        // 更新房间列表
        function updateRoomList(roomData) {
            rooms.clear();
            
            roomData.forEach(room => {
                rooms.set(room.id, room);
            });
            
            renderRoomList();
        }

        // 渲染房间列表
        function renderRoomList() {
            roomList.innerHTML = '';
            
            rooms.forEach(room => {
                const roomElement = document.createElement('div');
                roomElement.className = `room-item ${currentRoom && currentRoom.id === room.id ? 'active' : ''}`;
                roomElement.setAttribute('data-room-id', room.id);
                roomElement.onclick = () => joinRoom(room.id);
                
                roomElement.innerHTML = `
                    <div class="room-name">${room.name}</div>
                    <div class="room-id">${room.id}</div>
                    <div class="room-users">${room.userCount || 0} 用户</div>
                `;
                
                roomList.appendChild(roomElement);
            });
        }

        // 更新房间信息
        function updateRoomInList(room) {
            rooms.set(room.id, room);
            renderRoomList();
        }

        // 从列表中移除房间
        function removeRoomFromList(roomId) {
            rooms.delete(roomId);
            renderRoomList();
        }

        // 更新当前房间信息
        function updateCurrentRoomInfo() {
            if (currentRoom) {
                currentRoomInfo.innerHTML = `
                    <div class="room-item active">
                        <div class="room-name">${currentRoom.name}</div>
                        <div class="room-id">${currentRoom.id}</div>
                        <div style="font-size: 12px; margin-top: 5px;">${currentRoom.description || '无描述'}</div>
                        <div class="room-users">${currentRoom.userCount || 0} 用户</div>
                    </div>
                    <button onclick="leaveRoom()" class="btn btn-danger" style="margin-top: 10px;">离开房间</button>
                `;
            } else {
                currentRoomInfo.innerHTML = '<div style="color: #6b7280;">未加入任何房间</div>';
            }
        }

        // 更新房间成员列表
        function updateRoomMembers(users = []) {
            roomMembersList.innerHTML = '';
            
            if (users.length === 0) {
                roomMembersList.innerHTML = '<div style="color: #6b7280;">暂无成员</div>';
                return;
            }
            
            users.forEach(user => {
                const userElement = document.createElement('div');
                userElement.className = `user-item ${user.username === username ? 'current-user' : ''}`;
                userElement.innerHTML = `👤 ${user.username}`;
                roomMembersList.appendChild(userElement);
            });
        }

        // 更新用户信息
        function updateUserInfo() {
            currentUserInfo.innerHTML = `
                <div class="user-item current-user">
                    <strong>当前用户:</strong> ${username}
                </div>
                <div class="user-item">
                    <strong>连接状态:</strong> ${isConnected ? '已连接' : '未连接'}
                </div>
                <div class="user-item">
                    <strong>当前房间:</strong> ${currentRoom ? currentRoom.name : '未加入'}
                </div>
            `;
        }

        // 清空消息日志
        function clearMessages() {
            messages.innerHTML = '<div class="message-item system"><div class="message-content">消息已清空</div></div>';
        }

        // 刷新房间列表
        function refreshRooms() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('错误: 请先连接服务器', 'error');
                return;
            }

            const data = { type: 'get_rooms' };
            ws.send(JSON.stringify(data));
            addMessage('刷新房间列表', 'system');
        }

        // 事件监听器
        connectBtn.addEventListener('click', connect);
        disconnectBtn.addEventListener('click', disconnect);
        sendBtn.addEventListener('click', sendMessage);
        
        // 创建房间按钮
        document.getElementById('createRoomBtn').addEventListener('click', createRoom);
        
        // 生成客户端密钥按钮
        document.getElementById('generateKeysBtn').addEventListener('click', generateClientKeys);
        
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        usernameInput.addEventListener('change', function() {
            username = this.value || '测试用户';
            updateUserInfo();
        });

        // 初始化
        window.addEventListener('load', function() {
            addMessage('WebSocket房间聊天客户端已加载', 'system');
        });
    </script>
</body>
</html>
