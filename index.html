<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket 房间聊天客户端</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: #4f46e5;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin-bottom: 5px;
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .status.connected {
            background: #10b981;
        }

        .status.disconnected {
            background: #ef4444;
        }

        .main-content {
            padding: 20px;
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            gap: 20px;
            min-height: 600px;
        }

        .sidebar {
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            overflow-y: auto;
        }

        .center-panel {
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
        }

        .room-list {
            margin-bottom: 30px;
        }

        .room-list h4 {
            margin-bottom: 15px;
            color: #374151;
            border-bottom: 2px solid #4f46e5;
            padding-bottom: 5px;
        }

        .room-item {
            background: white;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.2s;
        }

        .room-item:hover {
            background: #e0e7ff;
            border-color: #4f46e5;
        }

        .room-item.active {
            background: #4f46e5;
            color: white;
        }

        .room-item .room-name {
            font-weight: 600;
            margin-bottom: 3px;
        }

        .room-item .room-id {
            font-size: 12px;
            opacity: 0.7;
        }

        .room-item .room-users {
            font-size: 11px;
            margin-top: 5px;
        }

        .create-room {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .create-room h4 {
            margin-bottom: 15px;
            color: #374151;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #374151;
            font-size: 14px;
        }

        .control-group input,
        .control-group textarea,
        .control-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            font-size: 14px;
        }

        .message-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
            height: 400px;
            /* 固定消息区域的总高度 */
        }

        .messages {
            height: 300px;
            /* 固定消息显示区域的高度 */
            background: #1f2937;
            color: #f9fafb;
            padding: 15px;
            border-radius: 5px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-bottom: 15px;
            flex-shrink: 0;
            /* 防止被压缩 */
        }

        .message-item {
            margin-bottom: 8px;
            padding: 8px;
            border-radius: 5px;
            line-height: 1.4;
        }

        .message-item.room-message {
            background: #065f46;
        }

        .message-item.encrypted-message {
            background: rgba(255, 193, 7, 0.1);
            border-left: 3px solid #ffc107;
        }

        .message-item.message-selected {
            background-color: rgba(40, 167, 69, 0.2);
            border-left: 3px solid #28a745;
            box-shadow: 0 0 5px rgba(40, 167, 69, 0.5);
        }

        .message-item.message-decrypted {
            background-color: rgba(32, 201, 151, 0.1);
            border-left: 3px solid #20c997;
            position: relative;
        }

        .message-item.message-decrypted::after {
            content: '✓';
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: #28a745;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .message-actions {
            margin-top: 8px;
            text-align: right;
        }

        .btn-small {
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 3px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-decrypt {
            background-color: #17a2b8;
            color: white;
        }

        .btn-decrypt:hover {
            background-color: #138496;
        }

        .message-item {
            cursor: pointer;
        }

        .message-item:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .message-item.room-notification {
            background: #7c2d12;
        }

        .message-item.system {
            background: #92400e;
        }

        .message-item.error {
            background: #7f1d1d;
        }

        .message-item.sent {
            background: #1e40af;
        }

        .message-header {
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 3px;
        }

        .message-content {
            word-wrap: break-word;
        }

        .input-area {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }

        .input-area input {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            font-size: 14px;
        }

        .input-area .btn {
            margin-bottom: 0;
            white-space: nowrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-right: 10px;
            margin-bottom: 10px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
        }

        .btn-primary:hover {
            background: #4338ca;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn:disabled {
            background: #d1d5db;
            cursor: not-allowed;
        }

        /* 密钥交换状态样式 */
        .success {
            color: #10b981;
            font-weight: bold;
        }

        .error {
            color: #ef4444;
            font-weight: bold;
        }

        .stats-panel {
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            margin-top: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .stat-item {
            background: white;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .stat-number {
            font-size: 20px;
            font-weight: bold;
            color: #4f46e5;
        }

        .stat-label {
            font-size: 11px;
            color: #6b7280;
            margin-top: 5px;
        }

        .user-info {
            margin-bottom: 30px;
        }

        .user-info h4 {
            margin-bottom: 15px;
            color: #374151;
            border-bottom: 2px solid #4f46e5;
            padding-bottom: 5px;
        }

        .user-item {
            background: white;
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
            font-size: 13px;
        }

        .user-item.current-user {
            background: #dbeafe;
            border-color: #3b82f6;
            font-weight: 600;
        }

        .room-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🏠 WebSocket 房间聊天客户端</h1>
            <p>实时连接状态: <span id="connectionStatus" class="status disconnected">未连接</span></p>
        </div>

        <div class="main-content">
            <!-- 左侧面板 - 房间列表 -->
            <div class="sidebar">
                <div class="room-list">
                    <h4>📋 可用房间</h4>
                    <div id="roomList">
                        <div class="room-item" data-room-id="general">
                            <div class="room-name">公共聊天室</div>
                            <div class="room-id">general</div>
                            <div class="room-users">0 用户</div>
                        </div>
                    </div>
                </div>

                <div class="create-room">
                    <h4>➕ 创建房间</h4>

                    <div class="control-group">
                        <label for="newRoomId">房间ID:</label>
                        <input type="text" id="newRoomId" placeholder="输入房间ID" required>
                    </div>

                    <div class="control-group">
                        <label for="newRoomName">房间名称:</label>
                        <input type="text" id="newRoomName" placeholder="输入房间名称" required>
                    </div>

                    <div class="control-group">
                        <label for="newRoomDesc">房间描述:</label>
                        <input type="text" id="newRoomDesc" placeholder="输入房间描述">
                    </div>

                    <div class="control-group">
                        <button id="createRoomBtn" class="btn btn-success">创建房间</button>
                    </div>
                </div>

                <div class="stats-panel">
                    <h4>📊 连接统计</h4>
                    <div class="stats">
                        <div class="stat-item">
                            <div class="stat-number" id="totalConnections">0</div>
                            <div class="stat-label">总连接数</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number" id="totalRooms">0</div>
                            <div class="stat-label">房间数</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number" id="totalUsers">0</div>
                            <div class="stat-label">总用户数</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number" id="connectionTime">--</div>
                            <div class="stat-label">连接时长(秒)</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 中间面板 - 消息区域 -->
            <div class="center-panel">
                <div class="user-info">
                    <h4>👤 用户信息</h4>
                    <div id="currentUserInfo">
                        <div style="color: #6b7280;">请先连接服务器并加入房间</div>
                    </div>
                </div>

                <div class="room-controls">
                    <div style="flex: 1;">
                        <label for="username">用户名:</label>
                        <input type="text" id="username" placeholder="输入你的用户名" value="测试用户">
                    </div>
                    <button id="connectBtn" class="btn btn-primary">连接服务器</button>
                    <button id="disconnectBtn" class="btn btn-danger" disabled>断开连接</button>
                </div>

                <!-- SM2密钥交换控制面板 -->
                <div
                    style="background: #f0f9ff; padding: 15px; border-radius: 8px; border: 1px solid #0ea5e9; margin-bottom: 15px;">
                    <h4 style="margin-bottom: 10px; color: #0c4a6e;">🔐 SM2国密密钥交换</h4>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px;">
                        <button id="generateKeysBtn" class="btn btn-success" onclick="generateClientKeys()" disabled>🔑
                            生成客户端密钥</button>
                        <span id="serverKeyStatus" class="error">服务器公钥: 未接收</span>
                        <span id="clientKeyStatus" class="error">客户端密钥: 未生成</span>
                    </div>
                    <div id="keyInfo" style="font-size: 12px; color: #374151;">
                        <div><strong>服务器公钥:</strong> <span id="serverKeyInfo">等待接收...</span></div>
                        <div><strong>客户端密钥:</strong> <span id="clientKeyInfo">等待生成...</span></div>
                    </div>
                </div>

                <div class="message-area">
                    <div id="messages" class="messages">
                        <div class="message-item system">
                            <div class="message-content">欢迎使用WebSocket房间聊天客户端！请先连接服务器。</div>
                        </div>
                    </div>

                    <div class="input-area">
                        <input type="text" id="messageInput" placeholder="输入消息... (按Enter发送)" disabled>
                        <button id="sendBtn" class="btn btn-primary" disabled>发送</button>
                        <button id="sendEncryptedBtn" class="btn btn-warning" disabled>🔒 发送加密消息</button>
                        <button id="decryptMessageBtn" class="btn btn-info" disabled>🔓 解密消息</button>
                    </div>
                </div>

                <div>
                    <button class="btn btn-secondary" onclick="sendPing()">发送心跳</button>
                    <button class="btn btn-secondary" onclick="clearMessages()">清空消息</button>
                    <button class="btn btn-secondary" onclick="refreshRooms()">刷新房间</button>
                </div>
            </div>

            <!-- 右侧面板 - 当前房间成员 -->
            <div class="sidebar">
                <div class="room-info">
                    <h4>🏠 当前房间</h4>
                    <div id="currentRoomInfo">
                        <div style="color: #6b7280;">未加入任何房间</div>
                    </div>
                </div>

                <div class="room-members" style="margin-top: 30px;">
                    <h4>👥 房间成员</h4>
                    <div id="roomMembers">
                        <div style="color: #6b7280;">暂无成员</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入SM2、SM3、SM4加密库（使用本地文件） -->
    <script src="node_modules/sm-crypto/dist/sm2.js"></script>
    <script src="node_modules/sm-crypto/dist/sm3.js"></script>
    <script src="node_modules/sm-crypto/dist/sm4.js"></script>

    <!-- 添加加密库加载状态检查 -->
    <script>
        console.log('=== SM加密库加载状态检查 ===');
        console.log('smCrypto:', typeof smCrypto !== 'undefined' ? '已加载' : '未定义');
        console.log('sm3:', typeof sm3 !== 'undefined' ? '已加载' : '未定义');
        console.log('sm4:', typeof sm4 !== 'undefined' ? '已加载' : '未定义');
        console.log('sm2:', typeof sm2 !== 'undefined' ? '已加载' : '未定义');

        // 显示库加载状态
        const libraryStatus = {
            smCrypto: typeof smCrypto !== 'undefined',
            sm3: typeof sm3 !== 'undefined',
            sm4: typeof sm4 !== 'undefined',
            sm2: typeof sm2 !== 'undefined'
        };

        console.log('库加载状态:', libraryStatus);

        // 检查可用性并设置全局引用
        if (libraryStatus.sm3 && libraryStatus.sm4) {
            console.log('✅ SM加密库加载成功');
        } else {
            console.warn('⚠️ SM加密库加载不完整，尝试其他方式...');

            // 尝试从window对象获取
            if (typeof window.sm3 !== 'undefined' && typeof window.sm4 !== 'undefined') {
                window.sm3Instance = window.sm3;
                window.sm4Instance = window.sm4;
                console.log('✅ 通过window对象获取到sm3和sm4实例');
            }
        }
    </script>

    <script>
        let ws = null;
        let isConnected = false;
        let connectionStartTime = null;
        let currentRoom = null;
        let username = '测试用户';
        let rooms = new Map();
        let roomMembers = new Map();

        // SM2密钥交换相关变量
        let serverPublicKey = null;
        let clientKeyPair = null;
        let userId = null;

        // 加密消息相关变量
        let isEncryptionMode = false; // 是否处于加密模式
        let selectedMessageElement = null; // 当前选中的要解密的消息

        // DOM 元素
        const connectionStatus = document.getElementById('connectionStatus');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const sendBtn = document.getElementById('sendBtn');
        const messages = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const usernameInput = document.getElementById('username');
        const roomList = document.getElementById('roomList');
        const currentRoomInfo = document.getElementById('currentRoomInfo');
        const roomMembersList = document.getElementById('roomMembers');
        const currentUserInfo = document.getElementById('currentUserInfo');

        // 统计元素
        const totalConnections = document.getElementById('totalConnections');
        const totalRooms = document.getElementById('totalRooms');
        const totalUsers = document.getElementById('totalUsers');
        const connectionTimeDisplay = document.getElementById('connectionTime');

        // 连接WebSocket服务器
        function connect() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                addMessage('已经连接', 'system');
                return;
            }

            const serverUrl = 'ws://localhost:3000';
            addMessage(`尝试连接到 ${serverUrl}...`, 'system');

            ws = new WebSocket(serverUrl);

            ws.onopen = function (event) {
                isConnected = true;
                connectionStartTime = Date.now();
                username = usernameInput.value || '测试用户';
                updateConnectionStatus('connected');
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                sendBtn.disabled = false;
                messageInput.disabled = false;
                addMessage('WebSocket连接已建立', 'system');

                // 更新用户信息显示
                updateUserInfo();

                // 开始更新时间
                setInterval(updateConnectionTime, 1000);

                // 获取房间列表
                refreshRooms();

                // 更新密钥交换UI
                updateKeyExchangeUI();
            };

            ws.onmessage = function (event) {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (e) {
                    addMessage(`接收非JSON消息: ${event.data}`, 'system');
                }
            };

            ws.onclose = function (event) {
                isConnected = false;
                updateConnectionStatus('disconnected');
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
                sendBtn.disabled = true;
                messageInput.disabled = true;
                addMessage(`WebSocket连接已关闭 (代码: ${event.code})`, 'system');
                currentRoom = null;
                updateCurrentRoomInfo();
                updateRoomMembers();

                // 重置密钥交换相关状态
                serverPublicKey = null;
                clientKeyPair = null;
                userId = null;
                updateKeyExchangeUI();
            };

            ws.onerror = function (error) {
                addMessage('WebSocket错误: ' + JSON.stringify(error), 'error');
            };
        }

        // 断开WebSocket连接
        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        // 处理接收到的消息
        function handleMessage(data) {
            console.log('收到消息:', data);
            console.log('=== handleMessage 被调用 ===');
            console.log('消息内容:', data);
            console.log('消息类型:', data.type);

            switch (data.type) {
                case 'welcome':
                    console.log('处理 welcome 消息');
                    handleWelcomeMessage(data);
                    break;

                case 'key_info':
                    console.log('处理 key_info 消息');
                    handleKeyInfoMessage(data);
                    break;

                case 'client_keys_ready':
                    handleClientKeysReady(data);
                    break;
                case 'room_key_info':
                    handleRoomKeyInfoMessage(data);
                    break;
                case 'room_key_summary':
                    handleRoomKeySummaryMessage(data);
                    break;
                case 'server_public_key':
                    handleServerPublicKeyMessage(data);
                    break;

                case 'client_keys_generated':
                    console.log('=== 处理服务端生成的客户端密钥 ===');
                    console.log('服务端生成的密钥信息:', data);

                    // 保存客户端密钥对
                    if (data.clientKeys) {
                        clientKeyPair = {
                            publicKey: data.clientKeys.publicKey,
                            privateKey: data.clientKeys.privateKey,
                            algorithm: data.clientKeys.algorithm,
                            curve: data.clientKeys.curve,
                            createdAt: data.clientKeys.createdAt,
                            generatedBy: data.clientKeys.generatedBy
                        };

                        console.log('客户端密钥对已保存:', clientKeyPair);
                    }

                    // 显示密钥生成成功信息
                    addMessage('✅ 服务端已成功生成您的SM2密钥对', 'success');
                    if (data.summary) {
                        addMessage(`🔑 客户端公钥长度: ${data.summary.clientPublicKeyLength || 'N/A'} 字符`, 'system');
                        addMessage(`🔒 客户端私钥长度: ${data.summary.clientPrivateKeyLength || 'N/A'} 字符`, 'system');
                        addMessage(`📋 生成方式: ${data.summary.exchangeMethod || '服务端生成'}`, 'system');
                    }

                    updateKeyExchangeUI();
                    break;

                case 'pong':
                    addMessage('收到心跳回复', 'system');
                    break;

                case 'room_joined':
                    currentRoom = data.room;
                    addMessage(`成功加入房间: ${data.room.name}`, 'system');
                    updateCurrentRoomInfo();
                    updateRoomMembers(data.room.users || []);
                    break;

                case 'room_left':
                    addMessage(`已离开房间: ${data.room}`, 'system');  // 期望data.room对象
                    currentRoom = null;
                    updateCurrentRoomInfo();
                    updateRoomMembers();
                    break;

                case 'room_message':
                    addRoomMessage(data);
                    break;

                case 'encrypted_message':
                    addEncryptedRoomMessage(data);
                    break;

                case 'room_notification':
                    addRoomNotification(data.message);
                    break;

                case 'room_update':
                    updateRoomInList(data.room);
                    if (currentRoom && data.room.id === currentRoom.id) {
                        currentRoom = data.room;
                        updateCurrentRoomInfo();
                        updateRoomMembers(data.room.users || []);
                    }
                    break;

                case 'room_created':

        // SM3-KDF密钥派生函数
        function sm3KDF(key, context, length = 16) {
            try {
                if (!key) {
                    throw new Error('原始密钥不能为空');
                }

                if (!context) {
                    throw new Error('派生上下文不能为空');
                }

                console.log('SM3-KDF参数:', { keyLength: key.length, context, length });

                let output = '';
                let counter = 1;

                // 获取sm3实例
                let sm3Instance;
                if (typeof smCrypto !== 'undefined' && smCrypto.sm3) {
                    sm3Instance = smCrypto.sm3;
                    console.log('使用smCrypto.sm3实例');
                } else if (typeof sm3 !== 'undefined') {
                    sm3Instance = sm3;

                } else if (typeof window.sm3 !== 'undefined') {

                } else {

                    console.log('可用的全局对象:', Object.keys(window).filter(key => key.includes('sm')));
                    throw new Error('SM3加密库未正确加载');
                }

                // KDF构造：KDF(K, Z) = SM3(CTX || K || counter)，迭代直到达到期望长度
                while (output.length < length * 2) { // length * 2 因为hex格式
                    const counterHex = counter.toString(16).padStart(2, '0'); // 转为十六进制并补零
                    const input = context + key + counterHex;

                    console.log(`KDF第${counter}轮输入:`, input.substring(0, 50) + '...');

                    // 使用SM3-HMAC计算
                    const hash = sm3Instance(input, { mode: 'hmac', key: key });
                    console.log(`KDF第${counter}轮输出:`, hash.substring(0, 20) + '...');

                    output += hash;
                    counter++;

                    // 防止无限循环
                    if (counter > 100) {
                        throw new Error('KDF计算超时，循环次数过多');
                    }
                }

                const result = output.substring(0, length * 2);
                console.log('SM3-KDF完成，输出长度:', result.length);

                return result;

            } catch (error) {
                console.error('SM3-KDF密钥派生失败:', error);

            if (b === 0) {
                throw new Error('cannot divide by zero');
            }
            const logA = LOG_TABLE[a];
            const logB = LOG_TABLE[b];
            const diff = (logA - logB + 255) % 255;
            const result = EXP_TABLE[diff];
            return a === 0 ? 0 : result;
        }

        function mult(a, b) {
            const logA = LOG_TABLE[a];
            const logB = LOG_TABLE[b];
            const sum = (logA + logB) % 255;
            const result = EXP_TABLE[sum];
            return a === 0 || b === 0 ? 0 : result;

        function interpolatePolynomial(xSamples, ySamples, x) {
            if (xSamples.length !== ySamples.length) {
                throw new Error('sample length mistmatch');
            }
            const limit = xSamples.length;
            let result = 0;
            for (let i = 0; i < limit; i++) {
                let basis = 1;
                for (let j = 0; j < limit; ++j) {
                    if (i === j) {
                        continue;
                    }
                    const num = add(x, xSamples[j]);
                    const denom = add(xSamples[i], xSamples[j]);
                    const term = div(num, denom);
                    basis = mult(basis, term);
                }
                result = add(result, mult(ySamples[i], basis));

            return result;

        function reconstructSm4Key(shares) {

                }

                for (let i = 0; i < shares.length; i++) {

                console.log('可用分片数:', shares.length);

                const binaryShares = shares.map(share => {
                    const binaryString = atob(share.share);
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }
                    return { index: share.index, data: bytes };
                });

                console.log('转换为二进制的分片:', binaryShares);

                // 验证所有分片长度相同
                const shareLength = binaryShares[0].data.length;
                for (const share of binaryShares) {
                    if (share.data.length !== shareLength) {
                        throw new Error('所有分片必须具有相同的长度');
                    }
                }

                // 使用Shamir重建算法恢复密钥
                const sharesLength = binaryShares.length;
                const secretLength = shareLength - 1;
                const secret = new Uint8Array(secretLength);

                const xSamples = new Uint8Array(sharesLength);
                const ySamples = new Uint8Array(sharesLength);

                    for (let j = 0; j < sharesLength; j++) {

                        xSamples[j] = binaryShares[j].data[shareLength - 1];
                        ySamples[j] = binaryShares[j].data[i];
                    }

                    // 插值计算当前字节的密钥值
                    secret[i] = interpolatePolynomial(xSamples, ySamples, 0);
                }
                console.log('xSamples' + xSamples);
                console.log('ySamples' + ySamples);
                console.log('secret' + secret);
                // 将二进制密钥转换为十六进制字符串
                let hexKey = '';
                for (let i = 0; i < secret.length; i++) {
                    hexKey += secret[i].toString(16).padStart(2, '0');

            for (let i = 0; i < maxLength; i += 2) {
                const byteA = parseInt(a.substring(i, i + 2), 16);
                const byteB = parseInt(b.substring(i, i + 2), 16);
                const xorResult = (byteA ^ byteB).toString(16).padStart(2, '0');
                result += xorResult;
            }
            return result;
        }

        // 检查是否可以重建SM4密钥
        function canReconstructKey() {
            if (!currentRoom || !currentRoom.shamirInfo) return false;
            // 这里应该检查是否收集了足够的分片
            // 暂时返回true，假设已经有了足够的分片
            return true;

            if (canReconstructKey()) {
                // 这里应该传入收集到的分片
                const sm4Key = reconstructSm4Key([]);
                if (sm4Key) {
                    currentRoom.sm4Key = sm4Key;
                    return sm4Key;

            return null;

        // 加密消息
        function encryptMessage(plainText, groupKey) {
            try {
                if (!plainText || !groupKey) {
                    throw new Error('明文或组密钥不能为空');
                }

                console.log('=== 开始加密消息 ===');

                console.log('window.sm3:', typeof window.sm3);
                console.log('window.sm4:', typeof window.sm4);

                // 获取sm3和sm4实例
                let sm3Instance, sm4Instance;

                if (typeof smCrypto !== 'undefined' && smCrypto.sm3 && smCrypto.sm4) {
                    sm3Instance = smCrypto.sm3;
                    sm4Instance = smCrypto.sm4;
                    console.log('使用smCrypto实例');
                } else if (typeof sm3 !== 'undefined' && typeof sm4 !== 'undefined') {
                    sm3Instance = sm3;

                } else if (typeof window.sm3 !== 'undefined' && typeof window.sm4 !== 'undefined') {
                    sm3Instance = window.sm3;

                    console.log('使用window.sm3/sm4实例');
                } else if (typeof window.sm3Instance !== 'undefined' && typeof window.sm4Instance !== 'undefined') {

                    throw new Error('SM加密库未正确加载');
                }

                // 使用SM3-HMAC派生对称密钥和IV
                console.log('开始派生密钥...');
                const key = sm3Instance(groupKey, { mode: 'hmac', key: 'sm4-key' });
                const iv = sm3Instance(groupKey, { mode: 'hmac', key: 'sm4-iv' }).substring(0, 32);
                console.log('密钥派生完成，密钥长度:', key.length, 'IV长度:', iv.length);

                // 使用SM4-CBC模式加密（添加IV参数）
                console.log('开始SM4加密...');
                const encrypted = sm4Instance.encrypt(plainText, key.substring(0, 32), iv);
                console.log('加密完成，密文长度:', encrypted.length);

                return {
                    ciphertext: encrypted,
                    iv: iv, // 保存IV用于解密
                    key: key.substring(0, 32), // 保存密钥用于解密
                    isEncrypted: true,
                    timestamp: new Date().toISOString()
                };
            } catch (error) {
                console.error('消息加密失败:', error);
                throw new Error('消息加密失败: ' + error.message);
            }
        }

        // 解密消息
        function decryptMessage(encryptedData, groupKey) {
            try {
                if (!encryptedData || !groupKey) {
                    throw new Error('密文数据或组密钥不能为空');
                }

                console.log('=== 开始解密消息 ===');
                console.log('密文长度:', encryptedData.ciphertext ? encryptedData.ciphertext.length : 'N/A');
                console.log('组密钥长度:', groupKey.length);
                console.log('smCrypto:', typeof smCrypto);
                console.log('sm3:', typeof sm3);
                console.log('sm4:', typeof sm4);

                // 获取sm3和sm4实例
                let sm3Instance, sm4Instance;

                if (typeof smCrypto !== 'undefined' && smCrypto.sm3 && smCrypto.sm4) {
                    sm3Instance = smCrypto.sm3;
                    sm4Instance = smCrypto.sm4;
                    console.log('使用smCrypto实例');
                } else if (typeof sm3 !== 'undefined' && typeof sm4 !== 'undefined') {
                    sm3Instance = sm3;
                    sm4Instance = sm4;
                    console.log('使用sm3/sm4实例');
                } else if (typeof window.sm3 !== 'undefined' && typeof window.sm4 !== 'undefined') {
                    sm3Instance = window.sm3;
                    sm4Instance = window.sm4;
                    console.log('使用window.sm3/sm4实例');
                } else if (typeof window.sm3Instance !== 'undefined' && typeof window.sm4Instance !== 'undefined') {
                    sm3Instance = window.sm3Instance;
                    sm4Instance = window.sm4Instance;
                    console.log('使用window.sm3Instance/sm4Instance实例');
                } else {
                    console.error('所有SM库都不可用');
                    console.log('可用的全局对象:', Object.keys(window).filter(key => key.includes('sm')));
                    throw new Error('SM加密库未正确加载');
                }

                // 使用SM3-HMAC派生对称密钥和IV
                console.log('开始派生密钥...');
                const key = sm3Instance(groupKey, { mode: 'hmac', key: 'sm4-key' });

                // 如果加密数据包含保存的IV，使用它；否则重新派生（为了兼容）
                let iv;
                if (encryptedData.iv) {
                    iv = encryptedData.iv;
                    console.log('使用保存的IV');
                } else {
                    iv = sm3Instance(groupKey, { mode: 'hmac', key: 'sm4-iv' }).substring(0, 32);
                    console.log('重新派生IV');
                }

                console.log('密钥派生完成，密钥长度:', key.length, 'IV长度:', iv.length);
                console.log('IV内容:', iv);
                console.log('密文前32字符:', encryptedData.ciphertext.substring(0, 32));

                // 解密密文（使用正确的IV）
                console.log('开始SM4解密...');
                const decrypted = sm4Instance.decrypt(encryptedData.ciphertext, key.substring(0, 32), iv);
                console.log('解密完成，明文长度:', decrypted.length);

                return decrypted;
            } catch (error) {
                console.error('消息解密失败:', error);
                console.error('错误详情:', {
                    message: error.message,
                    stack: error.stack,
                    encryptedDataKeys: Object.keys(encryptedData || {}),
                    groupKeyLength: groupKey ? groupKey.length : 'undefined'
                });
                throw new Error('消息解密失败: ' + error.message);
            }
        }

        function requestAdditionalShares() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('错误: 请先连接服务器', 'error');
                return;
            }

            if (!currentRoom || !currentRoom.shamirShare) {

            const data = {

        // 处理服务器返回的额外分片
        function handleAdditionalShares(data) {
            if (!data || !data.shares || data.shares.length === 0) {
                addMessage('错误: 未收到有效的分片', 'error');
                return;
            }

            try {
                // 确保currentRoom有足够的属性
                if (!currentRoom) {
                    addMessage('错误: 未加入任何房间', 'error');
                    return;
                }

                // 将新获取的分片添加到currentRoom
                if (!currentRoom.additionalShares) {
                    currentRoom.additionalShares = [];
                }

                // 添加新分片（去重）
                data.shares.forEach(share => {
                    const existingShare = currentRoom.additionalShares.find(s => s.index === share.index);
                    if (!existingShare) {
                        currentRoom.additionalShares.push(share);
                    }
                });

                // 收集所有可用的分片（自己的分片 + 额外获取的分片）
                const allShares = [currentRoom.shamirShare, ...currentRoom.additionalShares];

                // 输出所有分片信息
                console.log('收集到的所有分片:', allShares);

                // 检查是否达到阈值
                if (allShares.length >= currentRoom.shamirInfo.threshold) {
                    // 尝试重建SM4密钥
                    const sm4Key = reconstructSm4Key(allShares);
                    if (sm4Key) {
                        currentRoom.sm4Key = sm4Key;
                        addMessage(`✅ 成功重建SM4密钥！密钥长度: ${sm4Key.length}`, 'system');
                        addMessage(`🔓 已获取完整SM4密钥，可以进行加解密操作了！`, 'system');
                        updateRoomKeyDisplay();
                        updateAllButtonStates();
                    } else {
                        addMessage('❌ 密钥重建失败', 'error');
                    }
                } else {
                    addMessage(`🔄 已获取 ${allShares.length} 个分片，还需要 ${currentRoom.shamirInfo.threshold - allShares.length} 个分片才能重建密钥`, 'system');
                }

            } catch (error) {
                console.error('处理额外分片失败:', error);
                addMessage(`错误: 处理分片失败 - ${error.message}`, 'error');
            }
        }

            // 检查是否有选中的消息和SM4密钥
            const hasSelectedMessage = selectedMessageElement !== null;
            const hasRoom = currentRoom !== null;
            const hasSm4Key = hasRoom && (currentRoom.sm4Key || canReconstructKey());

            decryptBtn.disabled = !(hasSelectedMessage && hasRoom && hasSm4Key);

            // 更新按钮提示信息
            let tooltip = '';
            if (!hasSelectedMessage) tooltip = '请先选择一条加密消息';
            else if (!hasRoom) tooltip = '请先加入房间';
            else if (!hasSm4Key) tooltip = '请等待SM4密钥就绪';

            decryptBtn.title = tooltip;
        }

        // 更新所有按钮状态
        function updateAllButtonStates() {
            updateEncryptedButtonState();
            updateDecryptButtonState();
        }

        // 检查SM4密钥状态
        function checkSm4KeyStatus() {
            const sm4Key = getCurrentSm4Key();
            if (sm4Key) {
                console.log('✓ SM4密钥状态正常');
                return true;
            } else {
                console.log('⚠ SM4密钥不可用');
                return false;
            }
        }

        // 解密选中的消息
        function decryptSelectedMessage() {
            if (!selectedMessageElement) {
                addMessage('请先选择一条加密消息', 'error');
                return;
            }

            // 获取SM4密钥
            const sm4Key = getCurrentSm4Key();
            if (!currentRoom || !sm4Key) {
                addMessage('请先加入房间并获取SM4密钥', 'error');
                return;
            }

            try {
                // 获取加密数据
                const encryptedDataStr = selectedMessageElement.dataset.encryptedData;
                const encryptedData = JSON.parse(encryptedDataStr);

                // 解密消息
                const decryptedMessage = decryptMessage(encryptedData, sm4Key);

                // 显示解密后的消息
                selectedMessageElement.querySelector('.message-content').innerHTML = decryptedMessage;
                selectedMessageElement.classList.remove('message-selected');
                selectedMessageElement.classList.add('message-decrypted');

                // 清除选中的消息
                selectedMessageElement = null;
                updateDecryptButtonState();

                addMessage('🔓 消息解密成功', 'system');
            } catch (error) {
                addMessage(`解密失败: ${error.message}`, 'error');
            }
        }

        // 添加房间通知
        function addRoomNotification(message) {
            const messageElement = document.createElement('div');
            messageElement.className = 'message-item room-notification';

            const timestamp = new Date().toLocaleTimeString();
            messageElement.innerHTML = `
                <div class="message-header">[${timestamp}] 房间通知</div>
                <div class="message-content">${message}</div>
            `;

            messages.appendChild(messageElement);
            messages.scrollTop = messages.scrollHeight;
        }

        // 更新房间列表
        function updateRoomList(roomData) {
            rooms.clear();

            roomData.forEach(room => {
                rooms.set(room.id, room);
            });

            renderRoomList();
        }

        // 渲染房间列表
        function renderRoomList() {
            roomList.innerHTML = '';

            rooms.forEach(room => {
                const roomElement = document.createElement('div');
                roomElement.className = `room-item ${currentRoom && currentRoom.id === room.id ? 'active' : ''}`;
                roomElement.setAttribute('data-room-id', room.id);
                roomElement.onclick = () => joinRoom(room.id);

                roomElement.innerHTML = `
                    <div class="room-name">${room.name}</div>
                    <div class="room-id">${room.id}</div>
                    <div class="room-users">${room.userCount || 0} 用户</div>
                `;

                roomList.appendChild(roomElement);
            });
        }

        // 更新房间信息
        function updateRoomInList(room) {
            rooms.set(room.id, room);
            renderRoomList();
        }

        // 从列表中移除房间
        function removeRoomFromList(roomId) {
            rooms.delete(roomId);
            renderRoomList();
        }

        // 更新当前房间信息
        function updateCurrentRoomInfo() {
            if (currentRoom) {
                currentRoomInfo.innerHTML = `
                    <div class="room-item active">
                        <div class="room-name">${currentRoom.name}</div>
                        <div class="room-id">${currentRoom.id}</div>
                        <div style="font-size: 12px; margin-top: 5px;">${currentRoom.description || '无描述'}</div>
                        <div class="room-users">${currentRoom.userCount || 0} 用户</div>
                    </div>
                    <button onclick="leaveRoom()" class="btn btn-danger" style="margin-top: 10px;">离开房间</button>
                    <button onclick="requestAdditionalShares()" class="btn btn-primary" style="margin-top: 10px; margin-left: 5px;">获取额外分片</button>
                `;
            } else {
                currentRoomInfo.innerHTML = '<div style="color: #6b7280;">未加入任何房间</div>';
            }
            updateAllButtonStates(); // 更新按钮状态
        }

        // 更新房间成员列表
        function updateRoomMembers(users = []) {
            roomMembersList.innerHTML = '';

            if (users.length === 0) {
                roomMembersList.innerHTML = '<div style="color: #6b7280;">暂无成员</div>';
                return;
            }

            users.forEach(user => {
                const userElement = document.createElement('div');
                userElement.className = `user-item ${user.username === username ? 'current-user' : ''}`;
                userElement.innerHTML = `👤 ${user.username}`;
                roomMembersList.appendChild(userElement);
            });
        }

        // 更新用户信息
        function updateUserInfo() {
            currentUserInfo.innerHTML = `
                <div class="user-item current-user">
                    <strong>当前用户:</strong> ${username}
                </div>
                <div class="user-item">
                    <strong>连接状态:</strong> ${isConnected ? '已连接' : '未连接'}
                </div>
                <div class="user-item">
                    <strong>当前房间:</strong> ${currentRoom ? currentRoom.name : '未加入'}
                </div>
            `;
        }

        // 清空消息日志
        function clearMessages() {
            messages.innerHTML = '<div class="message-item system"><div class="message-content">消息已清空</div></div>';
        }

        // 刷新房间列表
        function refreshRooms() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('错误: 请先连接服务器', 'error');
                return;
            }

            const data = { type: 'get_rooms' };
            ws.send(JSON.stringify(data));
            addMessage('刷新房间列表', 'system');
        }

        // 事件监听器
        connectBtn.addEventListener('click', connect);
        disconnectBtn.addEventListener('click', disconnect);
        sendBtn.addEventListener('click', sendMessage);

        // 创建房间按钮
        document.getElementById('createRoomBtn').addEventListener('click', createRoom);

        // 生成客户端密钥按钮
        document.getElementById('generateKeysBtn').addEventListener('click', generateClientKeys);

        // 加密消息按钮
        document.getElementById('sendEncryptedBtn').addEventListener('click', sendEncryptedMessage);
        document.getElementById('decryptMessageBtn').addEventListener('click', decryptSelectedMessage);

        messageInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        usernameInput.addEventListener('change', function () {
            username = this.value || '测试用户';
            updateUserInfo();
        });

        // 初始化
        window.addEventListener('load', function () {
            addMessage('WebSocket房间聊天客户端已加载', 'system');
        });
    </script>
</body>

</html>
